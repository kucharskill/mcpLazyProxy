name: Check and release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Set release version
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version = "([0-9]+\.[0-9]+\.[0-9]+)"$').Groups[1].Value
          if (-not $version) { throw 'Missing package version.' }
          "RELEASE_VERSION=$version-build.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_ENV
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --locked
      - run: cargo +stable build --release --locked
      - name: Integration tests
        shell: pwsh
        run: |
          $env:LAZY_BINARY = "$PWD/target/release/mcp-lazy-proxy.exe"
          node --test --test-concurrency=1 tests/proxy.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and test extracted binary
        shell: pwsh
        run: |
          $archive = ./scripts/package.ps1 -ReleaseVersion $env:RELEASE_VERSION
          $destination = Join-Path $env:RUNNER_TEMP "mcp-lazy-proxy-$env:GITHUB_RUN_ID"
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          New-Item -ItemType Directory -Path "$destination/tests" | Out-Null
          Copy-Item tests/*.mjs "$destination/tests/"
          $env:LAZY_BINARY = Join-Path $destination 'mcp-lazy-proxy.exe'
          Set-Location $destination
          node --test --test-concurrency=1 tests/proxy.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish executable and checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = (Get-ChildItem ".tmp/release/mcp-lazy-proxy-$env:RELEASE_VERSION-windows-x64.zip").FullName
          gh release create "v$env:RELEASE_VERSION" $archive .tmp/release/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "v$env:RELEASE_VERSION" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
